services:
    identity-db:
        image: postgres:16-alpine
        container_name: identity-db
        env_file:
            - ./services/identity-service/.env
        ports:
            - "5433:5432"
        volumes:
            - identity_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - microservices-net
    
    identity-service:
        build:
            context: ./services/identity-service
            dockerfile: Dockerfile
        container_name: identity-service
        env_file: ./services/identity-service/.env
        ports:
            - "8001:8000"
        volumes:
            - ./services/identity-service/certs:/app/certs:ro
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
            interval: 30s
            timeout: 5s
            retries: 3
        depends_on:
            identity-db:
                condition: service_healthy
        networks:
            - microservices-net

    
    catalog-db:
        image: postgres:16-alpine
        container_name: catalog-db
        env_file:
            - ./services/catalog-service/.env
        ports:
            - "5434:5432"
        volumes:
            - catalog_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - microservices-net
    
    catalog-service:
        build:
            context: ./services/catalog-service
            dockerfile: Dockerfile
        container_name: catalog-service
        env_file: ./services/catalog-service/.env
        ports:
            - "8002:8000"
        depends_on:
            catalog-db:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        networks:
            - microservices-net
    
volumes:
    identity_db_data:
    catalog_db_data:

networks:
    microservices-net:
        driver: bridge