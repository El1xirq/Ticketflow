name: Identity CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment and JWT keys
        run: |
          make init
          cp services/catalog-service/.env.example services/catalog-service/.env

      - name: Build Docker image
        run: docker compose build identity-service

      - name: Start identity database
        run: docker compose up -d --wait identity-db

      - name: Run identity-service tests
        run: docker compose run --rm --no-deps --entrypoint pytest identity-service

      - name: Cleanup
        if: always()
        run: docker compose down -v