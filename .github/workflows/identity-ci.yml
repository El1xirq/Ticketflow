name: Identity CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment and JWT keys
        run: make init

      - name: Build Docker images
        run: docker compose build identity-service

      - name: Run identity-service tests
        run: docker compose run --rm identity-service pytest

      - name: Cleanup
        if: always()
        run: docker compose down -v